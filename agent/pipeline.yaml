version: 1

pipeline:
  - supervisor
  - planner
  - coder
  - tester
  - reviewer
  - pull_request
  - done

optional_stages:
  architect:
    position: before_planner
    when: task metadata explicitly sets architecture to required or the user explicitly requests architecture/design work

handoff_artifacts:
  task: agent/tasks/<task-id>.md
  architecture_design: agent/tasks/<task-id>.arch.md
  plan: agent/tasks/<task-id>.plan.md
  coder_notes: agent/tasks/<task-id>.coder.md
  test_report: agent/tasks/<task-id>.test.md
  review_report: agent/tasks/<task-id>.review.md

task_statuses:
  - queued
  - in_progress
  - planning
  - implementing
  - testing
  - reviewing
  - changes_required
  - approved
  - pr_created
  - done
  - blocked

retry:
  max_cycles: 2
  on_failure: supervisor classifies root cause and routes to the correct upstream agent
  on_max_retries_exceeded: status set to blocked, requires human intervention

feedback_routing:
  plan_issue: planner
  implementation_issue: coder
  test_gap: coder
  domain_brain_missing: coder
  architecture_issue: architect
