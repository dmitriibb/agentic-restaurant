version: 2

pipelines:
  implementation:
    description: Execute implementation-ready tasks through planning, coding, testing, and review.
    enforcement:
      supervisor_entry_required: true
      fresh_agent_context_per_stage: true
      retroactive_artifact_backfill_invalid: true
    task_selection:
      default: true
      when:
        - task metadata sets pipeline to implementation
        - or pipeline is omitted and architecture is not required
        - or the user explicitly asks to implement, fix, or work on an existing task
    stages:
      - supervisor
      - planner
      - coder
      - tester
      - reviewer
      - pull_request
      - done
    required_task_metadata:
      pipeline: implementation
      architecture: not_requested
    optional_task_metadata:
      source_architecture: <architecture-task-id>
    artifacts:
      task: agent/tasks/<task-id>.md
      audit_log: agent/tasks/<task-id>.agents-audit.md
      plan: agent/tasks/<task-id>.plan.md
      coder_notes: agent/tasks/<task-id>.coder.md
      test_report: agent/tasks/<task-id>.test.md
      review_report: agent/tasks/<task-id>.review.md
    source_architecture_resolution:
      preferred: agent/done/<source-architecture-id>/<source-architecture-id>.arch.md
      fallback: agent/tasks/<source-architecture-id>.arch.md
    id_policy:
      pattern: task-<nnn>-<slug>
      forbid_letter_suffixed_children: true
      rationale: every implementation task must be independently schedulable by the implementation pipeline

  architecture:
    description: Produce architecture and decompose it into implementation-ready tasks.
    enforcement:
      supervisor_entry_required: true
      fresh_agent_context_per_stage: true
      retroactive_artifact_backfill_invalid: true
    task_selection:
      when:
        - task metadata sets pipeline to architecture
        - or legacy task metadata sets architecture to required
        - or the user explicitly asks for architecture, design, or task decomposition
    stages:
      - supervisor
      - architect
      - task_splitter
      - done
    required_task_metadata:
      pipeline: architecture
      architecture: required
    artifacts:
      task: agent/tasks/<task-id>.md
      audit_log: agent/tasks/<task-id>.agents-audit.md
      architecture_design: agent/tasks/<task-id>.arch.md
      split_report: agent/tasks/<task-id>.split.md
      generated_tasks: agent/tasks/task-<nnn>-<slug>.md
    generated_task_rules:
      pipeline: implementation
      architecture: not_requested
      source_architecture: <architecture-task-id>
      id_policy: standalone sequential task ids only

pipeline_selection:
  prompt_hints:
    architecture:
      - architecture
      - design
      - boundaries
      - split into tasks
    implementation:
      - implement
      - fix
      - work on task
    e2e:
      - e2e
      - playwright
      - end-to-end
  future_pipelines:
    e2e:
      status: planned
      note: reserve pipeline id `e2e` for a later dedicated testing pipeline

agent_identity:
  first_chat_message_must_identify_role: true
  example: Working as planner agent.

execution_rules:
  direct_non_supervisor_execution_invalid: true
  single_context_multi_role_execution_invalid: true
  retroactive_artifact_synthesis_invalid: true

audit_log:
  file: agent/tasks/<task-id>.agents-audit.md
  archived_with_task: agent/done/<task-id>/<task-id>.agents-audit.md
  stage_agents:
    normal_execution_entries:
      - received: logged immediately when the agent receives the task, before any processing
      - completed: logged when the agent finishes work, describing what was done and who the task is passed to
    additional_entries_when:
      - retry_received
      - blocked
  supervisor:
    entries_when:
      - task_received
      - status_transition
      - stage_handoff
      - retry_routed
      - blocked
      - pr_handoff
      - archived
  entry_format: "YYYY-MM-DD HH:MM:SS - <agent-name>\n<short action description>"

task_statuses:
  - queued
  - in_progress
  - designing
  - splitting
  - planning
  - implementing
  - testing
  - reviewing
  - changes_required
  - approved
  - pr_created
  - done
  - blocked

retry:
  max_cycles: 2
  on_failure: supervisor classifies root cause and routes to the correct upstream agent or creates a separate architecture task when the issue is architectural
  on_max_retries_exceeded: status set to blocked, requires human intervention

feedback_routing:
  implementation:
    plan_issue: planner
    implementation_issue: coder
    test_gap: coder
    domain_brain_missing: coder
    architecture_gap: separate architecture task
  architecture:
    architecture_issue: architect
    task_decomposition_issue: task_splitter
