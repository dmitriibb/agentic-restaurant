services:

  # ──────────────────────── Databases ────────────────────────

  mongo:
    image: mongo:7.0
    container_name: restaurant-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: menu_db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 256M

  mysql:
    image: mysql:8.4
    container_name: restaurant-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: users_db          # created automatically by the image entrypoint
      MYSQL_USER: users                 # auto-granted on MYSQL_DATABASE
      MYSQL_PASSWORD: users
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────── Backend services ─────────────────────

  users-service:
    build:
      context: ./apps/users-service
    container_name: restaurant-users-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      # Database — shared MySQL instance
      USERS_DB_HOST: mysql
      USERS_DB_PORT: "3306"
      USERS_DB_NAME: users_db
      USERS_DB_USERNAME: users
      USERS_DB_PASSWORD: users
      # Auth
      USERS_JWT_SECRET: docker-compose-secret-change-in-prod
      USERS_JWT_EXPIRATION_SECONDS: "3600"
      USERS_INTERNAL_SERVICE_TOKEN: local-dev-token
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 384M

  menu-service:
    build:
      context: ./apps/menu-service
    container_name: restaurant-menu-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      # Database — Docker service name
      MENU_DB_HOST: mongo
      MENU_DB_PORT: "27017"
      MENU_DB_NAME: menu_db
      # Calls to users-service — Docker service name
      USERS_SERVICE_BASE_URL: http://users-service:8081
      MENU_TO_USERS_SERVICE_TOKEN: local-dev-token
      MENU_INTERNAL_SERVICE_TOKEN: menu-internal-token
      # Application auth
      APP_AUTH_NAME: menu-service
      APP_AUTH_SECRET: menu-service-secret
    depends_on:
      mongo:
        condition: service_healthy
      users-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 384M

  orders-service:
    build:
      context: ./apps/orders-service
    container_name: restaurant-orders-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      # Database — shared MySQL instance
      ORDERS_DB_HOST: mysql
      ORDERS_DB_PORT: "3306"
      ORDERS_DB_NAME: orders_db
      ORDERS_DB_USERNAME: orders
      ORDERS_DB_PASSWORD: orders
      # Calls to users-service
      USERS_SERVICE_BASE_URL: http://users-service:8081
      ORDERS_TO_USERS_SERVICE_TOKEN: local-dev-token
      # Calls to menu-service
      MENU_SERVICE_BASE_URL: http://menu-service:8082
      # Application auth
      APP_AUTH_NAME: orders-service
      APP_AUTH_SECRET: orders-service-secret
    depends_on:
      mysql:
        condition: service_healthy
      users-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 384M

  # ───────────────────── Frontend (SPA) ──────────────────────

  orders-client:
    build:
      context: ./apps/orders-client
    container_name: restaurant-orders-client
    ports:
      - "80:80"
    environment:
      VITE_APP_NAME: orders-client
      VITE_APP_SECRET: orders-client-secret
    depends_on:
      users-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mongo-data:
  mysql-data:
