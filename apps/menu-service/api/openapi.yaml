openapi: 3.0.3
info:
  title: Menu Service API
  version: 0.2.0
  description: Menu browse and internal item resolution contract.
servers:
  - url: http://localhost:8082
paths:
  /api/v1/menu-items:
    get:
      summary: List menu items for authenticated users
      operationId: listMenuItems
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Menu items list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemsResponse'
        '401':
          description: Missing or invalid bearer token
  /api/v1/internal/menu-items/resolve:
    post:
      summary: Resolve menu item ids for internal callers
      operationId: resolveMenuItems
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveMenuItemsRequest'
      responses:
        '200':
          description: Found and missing menu ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveMenuItemsResponse'
        '403':
          description: Missing or invalid service credential
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    MenuItem:
      type: object
      required: [id, name, description, price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
    MenuItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    ResolveMenuItemsRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items:
            type: integer
            format: int64
    ResolvedMenuItem:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: double
    ResolveMenuItemsResponse:
      type: object
      required: [items, missingItemIds]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedMenuItem'
        missingItemIds:
          type: array
          items:
            type: integer
            format: int64
