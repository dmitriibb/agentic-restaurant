spring:
  application:
    name: menu-service
  data:
    mongodb:
      uri: ${MENU_DB_URI:mongodb://${MENU_DB_HOST:localhost}:${MENU_DB_PORT:27017}/${MENU_DB_NAME:menu_db}}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,mongo
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  runtime:
    required-java-feature: ${JAVA_FEATURE_REQUIRED:21}
