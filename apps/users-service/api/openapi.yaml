openapi: 3.0.3
info:
  title: Users Service API
  version: 0.4.0
  description: Authentication, application token pool, guest user creation, and internal token validation contract.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/auth/login:
    post:
      summary: Authenticate with login and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials or inactive user
  /api/v1/auth/applications/token:
    post:
      summary: Acquire an application token from the pool
      operationId: acquireApplicationToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationTokenRequest'
      responses:
        '200':
          description: Token acquired successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTokenResponse'
        '401':
          description: Application not found or secret incorrect
        '403':
          description: Application is disabled
        '503':
          description: All pool slots occupied by active instances
  /api/v1/auth/guests:
    post:
      summary: Create a guest user and issue a 24-hour JWT
      operationId: createGuest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestRequest'
      responses:
        '201':
          description: Guest user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGuestResponse'
        '400':
          description: Invalid or missing displayName
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an APPLICATION user
  /api/v1/internal/auth/validate:
    post:
      summary: Validate JWT for internal services
      operationId: validateToken
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
        '403':
          description: Missing or invalid service credential
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          format: int32
          example: 3600
        user:
          $ref: '#/components/schemas/UserSummary'
    ApplicationTokenRequest:
      type: object
      required:
        - applicationName
        - applicationSecret
      properties:
        applicationName:
          type: string
          example: menu-service
        applicationSecret:
          type: string
          format: password
    ApplicationTokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          format: int32
          example: 3600
        user:
          $ref: '#/components/schemas/UserSummary'
    ValidateTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    ValidateTokenResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        userId:
          type: integer
          format: int64
        login:
          type: string
        roles:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        clientType:
          type: string
          description: Client type of the token holder (REGISTERED_USER, GUEST_USER, APPLICATION). Defaults to REGISTERED_USER for legacy tokens.
          example: REGISTERED_USER
        displayName:
          type: string
          description: Display name of the user. Present for guest users (from JWT claim) and registered users with a display name (from database).
    UserSummary:
      type: object
      required:
        - id
        - login
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        displayName:
          type: string
        clientType:
          type: string
          example: REGISTERED_USER
    CreateGuestRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          maxLength: 100
          example: John
    CreateGuestResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          format: int32
          example: 86400
        user:
          $ref: '#/components/schemas/UserSummary'
