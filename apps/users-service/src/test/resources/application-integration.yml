spring:
  datasource:
    url: jdbc:h2:mem:users_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
app:
  security:
    jwt-secret: integration-test-jwt-secret-key-0123456789
    jwt-expiration-seconds: 3600
    internal-service-token: integration-service-token
    guest-retention-days: 7
