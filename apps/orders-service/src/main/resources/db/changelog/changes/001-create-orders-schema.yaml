databaseChangeLog:
  - changeSet:
      id: 001-create-orders-table
      author: codex
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_request_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: orders
            columnNames: user_id, external_request_id
            constraintName: uq_orders_user_request

  - changeSet:
      id: 002-create-order-lines-table
      author: codex
      changes:
        - createTable:
            tableName: order_lines
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: menu_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: menu_item_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: line_total
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: order_lines
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_lines_order_id
            onDelete: CASCADE
