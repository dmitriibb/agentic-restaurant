spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orders_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: orders
    password: orders

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    users-service-base-url: http://localhost:8081
    users-service-token: local-dev-token
  menu:
    base-url: http://localhost:8082
    service-token: menu-internal-token
  outbox:
    exchange: restaurant.production.v1
    production-item-requested-routing-key: item.requested
