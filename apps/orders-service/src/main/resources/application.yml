spring:
  application:
    name: orders-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:mysql://${ORDERS_DB_HOST:localhost}:${ORDERS_DB_PORT:3307}/${ORDERS_DB_NAME:orders_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${ORDERS_DB_USERNAME:orders}
    password: ${ORDERS_DB_PASSWORD:orders}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
