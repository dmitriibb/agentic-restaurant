spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orders_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: orders
    password: orders
  liquibase:
    enabled: true
  task:
    scheduling:
      enabled: false

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    users-service-base-url: http://localhost:8081
    users-service-token: integration-users-token
    application-name: orders-service
    application-secret: orders-service-secret
  menu:
    base-url: http://localhost:8082
  outbox:
    exchange: restaurant.production.v1
    production-item-requested-routing-key: item.requested
