openapi: 3.0.3
info:
  title: Orders Service API
  version: 0.2.0
  description: Order submission contract with idempotent request ids.
servers:
  - url: http://localhost:8083
paths:
  /api/v1/orders/{requestId}:
    put:
      summary: Submit order
      description: |
        Submit an order with idempotent `requestId`.
        Repeating the same request id for the same authenticated user returns the same order.
      operationId: submitOrder
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Invalid request body or unknown menu items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Request user id does not match authenticated user
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SubmitOrderRequest:
      type: object
      required: [userId, items]
      properties:
        userId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineRequest'
    OrderLineRequest:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
    SubmitOrderResponse:
      type: object
      required: [orderId, requestId, status, totalAmount]
      properties:
        orderId:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        status:
          type: string
        totalAmount:
          type: number
          format: double
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
