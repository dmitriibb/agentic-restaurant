server {
    listen 80;
    server_name _;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Reverse-proxy rules for backend APIs ----------

    location /api/v1/auth/ {
        proxy_pass         http://users-service:8081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/production/ {
        proxy_pass         http://production-service:8084;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- SPA fallback ----------
    # Any route not matching /api/* falls back to index.html
    # so that React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
